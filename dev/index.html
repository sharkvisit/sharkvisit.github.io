<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHARK VISIT DEV</title>
<meta name="theme-color" content="#4A4F55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="SHARK VISIT DEV">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // ====== GANTI DENGAN LINK /exec APLIKASI DEV ======
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz2oIaZuUimUyUAlq2lap33Mu3EX1HLTuXi-HOy4fprgUxDPAjqkOoUYWobd4SpblsNHQ/exec';
  // ==================================================================
</script>
<style>
  :root { --or:#FF4814; --or2:#D23F17; --sh:#4A4F55; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--sh); }
  body { color:#fff; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  /* ---------- halaman pembuka ---------- */
  #pembuka { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
             padding:24px 16px; text-align:center; position:relative; overflow:hidden; }
  #pembuka::before { content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--or); }
  .wm { position:absolute; right:-20px; bottom:-30px; font-family:"Arial Black",Arial,sans-serif; font-weight:900; font-size:150px;
        letter-spacing:-4px; line-height:1; color:rgba(255,255,255,.07); pointer-events:none; user-select:none; }
  img.logo, h1, p, .btn, .langkah { position:relative; }
  img.logo { width:160px; height:160px; border-radius:32px; box-shadow:0 10px 28px rgba(0,0,0,.35); }
  h1 { font-size:28px; letter-spacing:1px; margin:18px 0 6px; }
  p { margin:4px 0; font-size:15px; opacity:.9; max-width:420px; line-height:1.45; }
  .btn { display:block; width:100%; max-width:340px; margin:14px auto 0; padding:15px; border-radius:12px; border:none;
         font:inherit; font-size:17px; font-weight:800; text-decoration:none; cursor:pointer; }
  .putih { background:#fff; color:var(--or2); }
  .oranye { background:var(--or); color:#fff; }
  .hidden { display:none !important; }
  .langkah { background:rgba(255,255,255,.08); border-radius:12px; padding:12px 14px; margin-top:18px; max-width:380px; text-align:left; font-size:14px; }
  .langkah b { font-weight:800; }
  /* ---------- aplikasi layar penuh ---------- */
  #aplikasi { position:fixed; inset:0; background:var(--sh); }
  #aplikasi iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#F4F5F7; }
  #memuat { position:absolute; inset:0; z-index:2; background:var(--sh); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; font-size:14px; }
  #memuat img { width:96px; height:96px; border-radius:22px; }
  .putar { width:28px; height:28px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:p 1s linear infinite; }
  @keyframes p { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="pembuka" class="hidden">
    <div class="wm" aria-hidden="true">VISIT</div>
    <img class="logo" src="../icon-512.png" alt="Shark">
    <h1>SHARK VISIT DEV</h1>
    <p>PT Sharprindo Dinamika Prima</p>
    <button id="btnPasang" class="btn oranye hidden">Pasang di Layar Utama</button>
    <button id="btnBuka" class="btn putih">Buka SHARK VISIT</button>
    <div class="langkah">
      <b>Pasang aplikasi di HP:</b><br>
      Android (Chrome): ketuk menu <b>⋮</b> → <b>Instal aplikasi</b> / <b>Tambahkan ke layar utama</b>.<br>
      iPhone (Safari): ketuk <b>Bagikan</b> → <b>Tambahkan ke Layar Utama</b>.
    </div>
  </div>

  <div id="aplikasi" class="hidden">
    <div id="memuat"><img src="../icon-192.png" alt=""><div class="putar"></div><span id="memuatTeks">Memuat SHARK VISIT…</span></div>
    <iframe id="layar" title="SHARK VISIT"
            allow="geolocation *; camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *"></iframe>
  </div>

<script>
  // Aplikasi SHARK VISIT (Apps Script) dimuat di dalam halaman ini, jadi tampil layar penuh tanpa bar Chrome.
  //  - ?app=1             : dibuka dari ikon di layar utama -> langsung aplikasi
  //  - ?login=1&email=... : kembali dari project Login Google -> diteruskan ke aplikasi
  //  - pindah halaman di dalam aplikasi (Menu <-> Sales Visit) dikirim lewat postMessage dari file Bungkus.html
  var q = new URLSearchParams(location.search);
  var ID = (APP_URL.match(/\/s\/([^/]+)\//) || [])[1] || '';
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  function tambahParam(url, obj) {
    var u = new URL(url);
    Object.keys(obj).forEach(function (k) { u.searchParams.set(k, obj[k]); });
    return u.toString();
  }
  // ---------- TOMBOL BACK HP ----------
  // Setiap layar yang dibuka dari sentuhan pengguna dicatat sebagai satu langkah riwayat (TUMPUK).
  // Tombol Back HP mundur satu langkah -> aplikasi diminta menampilkan layar sebelumnya.
  // Langkah TIDAK dibuat ulang setelah Back, karena Chrome HP melewati langkah riwayat yang dibuat tanpa sentuhan.
  //   HAL    : halaman aktif (menu / visit / history)
  //   TUMPUK : layar di dalam Menu, mis. ['scrMenu','scrKatalog','scrKatList','scrKatItem']
  //   NAIK   : ada langkah riwayat untuk halaman Sales Visit / History (dibuka dari Menu)
  var HAL = 'menu', TUMPUK = ['scrMenu'], NAIK = false, ABAIKAN = 0, ANTRI = [];
  function halDari(url) { var m = /[?&]page=([a-z]+)/i.exec(url); return m ? m[1].toLowerCase() : 'menu'; }
  function mundur(n) { if (n > 0) { ABAIKAN++; history.go(-n); } }
  function kirimKeAplikasi(pesan) {   // aplikasi Apps Script berada beberapa lapis iframe di dalam
    (function kirim(w, n) {
      try { w.postMessage(pesan, '*'); } catch (e) {}
      if (n > 3) return;
      try { for (var i = 0; i < w.frames.length; i++) kirim(w.frames[i], n + 1); } catch (e) {}
    })(document.getElementById('layar').contentWindow, 0);
  }
  function catatLayar(id) {           // laporan dari Menu.html: layar id baru saja tampil
    if (ABAIKAN) { ANTRI.push(id); return; }
    if (HAL !== 'menu') return;
    var k = TUMPUK.indexOf(id);
    if (k > -1) { mundur(TUMPUK.length - 1 - k); TUMPUK.length = k + 1; }   // naik ke layar sebelumnya lewat tombol ‹
    else { history.pushState({ sv: TUMPUK.length }, ''); TUMPUK.push(id); }  // layar baru: satu langkah riwayat
  }
  window.addEventListener('popstate', function () {
    if (ABAIKAN) {
      ABAIKAN--;
      if (!ABAIKAN) { var a = ANTRI; ANTRI = []; a.forEach(catatLayar); }
      return;
    }
    if (HAL !== 'menu') { NAIK = false; muatHalaman(tambahParam(APP_URL, { page: 'menu' })); return; }   // Sales Visit / History -> Menu
    if (TUMPUK.length > 1) { TUMPUK.pop(); kirimKeAplikasi({ sharkBack: 1, ke: TUMPUK[TUMPUK.length - 1] }); }
  });

  var LABEL = { menu: 'Membuka Menu…', visit: 'Membuka Sales Visit…', history: 'Membuka History…' }, SIAP_T = null;
  function selesaiMemuat() { clearTimeout(SIAP_T); document.getElementById('memuat').classList.add('hidden'); }
  function muatHalaman(url) {
    document.getElementById('pembuka').classList.add('hidden');
    document.getElementById('aplikasi').classList.remove('hidden');
    HAL = halDari(url); TUMPUK = ['scrMenu'];
    // Layar "Membuka …" tetap tampil sampai aplikasi mengirim tanda siap (maks. 20 detik)
    document.getElementById('memuatTeks').textContent = LABEL[HAL] || 'Memuat SHARK VISIT…';
    document.getElementById('memuat').classList.remove('hidden');
    clearTimeout(SIAP_T); SIAP_T = setTimeout(selesaiMemuat, 20000);
    // iframe diganti baru (bukan mengubah src) supaya pindah halaman tidak menumpuk riwayat Back
    var lama = document.getElementById('layar'), f = lama.cloneNode(false);
    f.setAttribute('src', tambahParam(url, { wrap: '1' }));
    lama.parentNode.replaceChild(f, lama);
  }
  function bukaAplikasi(url) {        // pindah halaman dari link di dalam aplikasi
    var tujuan = halDari(url);
    if (tujuan === 'menu') { if (HAL !== 'menu' && NAIK) { NAIK = false; mundur(1); } }
    else if (HAL === 'menu') { history.pushState({ sv: 'hal' }, ''); NAIK = true; }
    muatHalaman(url);
  }

  function awal() {
    var p = { page: 'menu' };
    if (q.get('login') === '1') ['login', 'email', 'ts', 'sig'].forEach(function (k) { if (q.get(k)) p[k] = q.get(k); });
    if (q.get('page')) p.page = q.get('page');
    // bersihkan alamat supaya data login tidak tersimpan di riwayat
    try { history.replaceState(null, '', location.pathname + (standalone ? '?app=1' : '')); } catch (e) {}
    muatHalaman(tambahParam(APP_URL, p));
  }

  // Pesan dari aplikasi: pindah halaman tetap di dalam layar penuh (hanya link aplikasi ini yang diterima)
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    if (d.sharkSiap) { selesaiMemuat(); return; }                 // aplikasi sudah tampil
    if (d.sharkLayar) { catatLayar(d.sharkLayar); return; }      // laporan layar aktif dari Menu.html
    if (!d.sharkNav) return;
    if (!ID || String(d.sharkNav).indexOf(ID) < 0) return;
    bukaAplikasi(d.sharkNav);
  });

  if (/GANTI_DENGAN/.test(APP_URL)) {
    document.body.innerHTML = '<p style="padding:24px">Admin: isi APP_URL di index.html dengan link /exec aplikasi.</p>';
  } else if (q.get('app') === '1' || q.get('login') === '1' || standalone) {
    awal();
  } else {
    document.getElementById('pembuka').classList.remove('hidden');
    document.getElementById('btnBuka').onclick = awal;
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function () {});
  var promptPasang = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); promptPasang = e;
    document.getElementById('btnPasang').classList.remove('hidden');
  });
  document.getElementById('btnPasang').onclick = function () {
    if (!promptPasang) return;
    promptPasang.prompt();
    promptPasang.userChoice.then(function () { promptPasang = null; document.getElementById('btnPasang').classList.add('hidden'); });
  };
</script>
</body>
</html>
